<div>
  <h2>Mantenimiento de Películas</h2>
  <div class="row mt-4 g-4">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white fw-bold">
          {{ modoEdicion ? 'Editar Película' : 'Nueva Película' }}
        </div>
        <div class="card-body">
          <form (ngSubmit)="guardar()">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" [(ngModel)]="peliculaActual.nombre" name="nombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Duración (minutos)</label>
              <input type="number" class="form-control" [(ngModel)]="peliculaActual.duracion" name="duracion" required>
            </div>
            <button type="submit" class="btn btn-success me-2">{{ modoEdicion ? 'Actualizar' : 'Guardar' }}</button>
            <button type="button" class="btn btn-secondary" (click)="resetForm()">Cancelar</button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-md-8">
      <table class="table table-striped table-hover border shadow-sm">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Duración</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of peliculas">
            <td>{{ p.idPelicula }}</td>
            <td>{{ p.nombre }}</td>
            <td>{{ p.duracion }} min</td>
            <td>
              <button class="btn btn-primary btn-sm me-1" (click)="editar(p)">Editar</button>
              <button class="btn btn-danger btn-sm" (click)="eliminar(p.idPelicula)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
