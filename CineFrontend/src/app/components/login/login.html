<div class="container mt-5" style="max-width: 400px;">
  <div class="card shadow">
    <div class="card-header bg-primary text-white text-center py-3">
      <h4 class="mb-0">Iniciar Sesión</h4>
    </div>
    <div class="card-body p-4">
      <form (ngSubmit)="onLogin()">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" class="form-control" [(ngModel)]="usuario" name="usuario" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="clave" name="clave" required>
        </div>
        <div *ngIf="errorMsg" class="alert alert-danger py-2 mb-3">{{ errorMsg }}</div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>
      <small class="text-muted d-block mt-3 text-center">Credenciales por defecto: admin / 12345</small>
    </div>
  </div>
</div>
